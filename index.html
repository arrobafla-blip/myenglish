<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My English Journey</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14213D"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My English">
<style>
:root{--navy:#14213D;--pink:#FF2E93;--or:#FF7A00;--bg:#FFF9F6;--card:#fff;--tx:#14213D;--mut:#667085;--ac:var(--or);--bd:#f0e4dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1427;--card:#1a2542;--tx:#f4f6fb;--mut:#a3adc2;--bd:#2a3659}}
:root[data-theme=dark]{--bg:#0d1427;--card:#1a2542;--tx:#f4f6fb;--mut:#a3adc2;--bd:#2a3659}
:root[data-acc=pink]{--ac:var(--pink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}h1,h2,h3{margin:.2em 0 .4em}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #14213d14}
button,.b{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--ac);color:#fff;font-weight:600}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.o{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:#cfd6e6;padding:8px 6px;font-size:13px}nav button.on{color:#fff;border-bottom:3px solid var(--ac);border-radius:0}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tag{background:var(--pink);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}.m{color:var(--mut);font-size:14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ok{color:#0a8f4d}.no{color:#d92d20}.big{font-size:26px;font-weight:700}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='mej1',def={ob:0,lvl:'',goal:20,theme:'auto',acc:'orange',done:{},words:[],log:[],diag:null};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const norm=s=>String(s).toLowerCase().replace(/[.?!,]/g,'').replace(/\s+/g,' ').trim();
const LES=[
{id:1,t:'Verbo to be (ser/estar)',obj:'Falar quem você é e como está.',exp:'To be = ser/estar. I am · you are · he/she/it is · we/you/they are. Forma curta: I\'m, she\'s, they\'re. Idade também usa to be: "I am 30" (nunca "I have 30").',ex:[['I am a designer.','Eu sou designer.'],['She is at home.','Ela está em casa.'],['We are tired.','Nós estamos cansados.']],ws:[['tired','cansado(a)'],['at home','em casa']],q:[{p:'My name ___ Ana.',o:['am','is','are'],a:'is',e:'Com he/she/it (e "my name"), usamos is.'},{p:'They ___ my friends.',o:['is','am','are'],a:'are',e:'They pede are.'},{p:'I ___ 30 years old. (am/have)',a:'am',e:'Em inglês a idade usa to be: I am 30.'}]},
{id:2,t:'Cumprimentos e apresentações',obj:'Cumprimentar e se apresentar em 3 frases.',exp:'Hello/Hi (qualquer hora). Good morning/afternoon/evening (cumprimento). Good night = só para despedida. Resposta padrão: "I\'m fine, thanks. And you?"',ex:[['Nice to meet you.','Prazer em conhecer você.'],['How are you?','Como você está?'],['I\'m fine, thanks. And you?','Estou bem, obrigada. E você?']],ws:[['nice to meet you','prazer em conhecer'],['good night','boa noite (despedida)']],q:[{p:'Resposta natural a "Nice to meet you":',o:['Nice to meet you, too.','I am fine.','Good night.'],a:'Nice to meet you, too.',e:'"too" = igualmente.'},{p:'How ___ you?',a:'are',e:'How are you? usa are com you.'},{p:'Qual frase usamos ao se despedir à noite?',o:['Good morning','Good night','Hello'],a:'Good night',e:'Good night é despedida; para chegar à noite, Good evening.'}]},
{id:3,t:'Simple Present: rotina',obj:'Descrever hábitos e rotina.',exp:'Para hábitos usamos o verbo base. Com he/she/it adicionamos -s (-es depois de ch, sh, o, s, x): works, watches, goes. Erro comum: "She work" ❌.',ex:[['I work at an agency.','Eu trabalho em uma agência.'],['She drinks coffee every day.','Ela toma café todo dia.'],['He watches TV at night.','Ele assiste TV à noite.']],ws:[['every day','todos os dias'],['agency','agência']],q:[{p:'She ___ coffee every day.',o:['drink','drinks','drinking'],a:'drinks',e:'She = 3ª pessoa: verbo + s.'},{p:'I ___ at an agency.',o:['work','works','am work'],a:'work',e:'Com I, o verbo fica na forma base.'},{p:'He ___ TV at night. (watch)',a:'watches',e:'Verbos com -ch ganham -es: watches.'}]}];
const DQ=[{tag:'Vocabulário',p:'"Book" significa:',o:['livro','porta','mesa'],a:'livro'},{tag:'Gramática',p:'I ___ happy.',o:['is','am','are'],a:'am'},{tag:'Gramática',p:'She ___ two kids.',o:['have','has','haves'],a:'has'},{tag:'Leitura',p:'"Tom works in a bank. He starts at 9." Where does Tom work?',o:['In a bank','At home','In a school'],a:'In a bank'},{tag:'Gramática',p:'Yesterday I ___ to the store.',o:['go','went','goed'],a:'went'},{tag:'Construção de frases',p:'Complete: Where ___ you from?',a:'are'}];
let V=S.ob?'home':'ob',R=null,RV=null;
function addCard(en,pt,ex,cat){if(S.words.some(w=>norm(w.en)==norm(en)))return false;S.words.push({id:Date.now()+Math.random(),en,pt,ex:ex||'',cat:cat||'Vocabulário cotidiano',added:day(),rep:0,ease:2.5,int:0,due:day(),ok:0,err:0});save();return true}
const dues=()=>S.words.filter(w=>w.due<=day());
const mins=d=>S.log.filter(l=>l.d==d).reduce((a,l)=>a+l.min,0);
function streak(){let n=0,o=mins(day())?0:-1;while(S.log.some(l=>l.d==day(o))){n++;o--}return n}
const nextLes=()=>LES.find(l=>!S.done[l.id]);
function go(v){V=v;render()}
function speak(t){if(!('speechSynthesis' in window))return alert('Seu navegador não tem voz sintetizada.');const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
function run(qs,cb,kind){R={qs,i:0,ok:0,miss:[],fb:null,cb,kind};go('run')}
function ans(v){const q=R.qs[R.i],ok=norm(v)==norm(q.a);R.fb={ok,v};ok?R.ok++:R.miss.push(q);render()}
function nxt(){R.i++;R.fb=null;R.i>=R.qs.length?R.cb(R):render()}
function vRun(){const q=R.qs[R.i],f=R.fb;let h=`<div class="c"><span class="m">Pergunta ${R.i+1} de ${R.qs.length}</span><div class="bar"><i style="width:${R.i/R.qs.length*100}%"></i></div><h3>${esc(q.p)}</h3>`;
if(!f){h+=q.o?q.o.map(o=>`<button class="o" onclick="ans(this.textContent)">${esc(o)}</button>`).join(''):`<input id="fi" autocomplete="off" placeholder="Digite em inglês" onkeydown="if(event.key=='Enter')ans(this.value)"><button onclick="ans($('#fi').value)">Verificar</button>`}
else h+=`<p class="${f.ok?'ok':'no'} big">${f.ok?'Correto! ✓':'Quase — resposta: '+esc(q.a)}</p>${q.e?`<p>${esc(q.e)}</p>`:''}<button onclick="nxt()">Continuar</button>`;return h+'</div>'}
function endDiag(r){const sc=r.ok,lvl=sc<=2?'Pré-A1':sc<=4?'A1':'A2';const tags=[...new Set(r.miss.map(q=>q.tag))];S.lvl=lvl;S.diag={d:day(),sc,n:r.qs.length,tags};S.ob=1;save();V='diag'}
function endLes(r){const l=r.l,pct=Math.round(r.ok/r.qs.length*100);S.done[l.id]={pct,d:day()};S.log.push({d:day(),min:6,xp:10+r.ok*5,t:'lesson'});r.miss.forEach(q=>addCard(q.p.replace(/___.*?(?=[.?!]|$)/,q.a).replace(/\s\(.*\)/,''),q.e,'', 'Erros recorrentes'));save();V='lesdone';RV={l,pct,miss:r.miss.length}}
function openLes(id){const l=LES.find(x=>x.id==id);RV={l,id};go('les')}
function startQ(id){const l=LES.find(x=>x.id==id);run(l.q,r=>endLes({...r,l}),'les');R.l=l}
function addW(id,i){const l=LES.find(x=>x.id==id),w=l.ws[i];alert(addCard(w[0],w[1],'','Vocabulário cotidiano')?'Salvo no glossário!':'Já está no glossário.')}
function grade(g){const w=RV.w;w.rep=g<3?0:w.rep+1;g<3?w.err++:w.ok++;w.int=g<3?1:w.rep==1?1:w.rep==2?3:Math.round(w.int*w.ease);w.ease=Math.max(1.3,w.ease+.1-(5-g)*(.08+(5-g)*.02));w.due=day(w.int);RV.n++;S.log.push({d:day(),min:.5,xp:2,t:'rev'});if(g==0)RV.q.push(w.id);save();RV.sh=0;render()}
function vRev(){if(!RV||RV.k!='rev')RV={k:'rev',q:dues().map(w=>w.id),n:0,sh:0};const id=RV.q.shift();const w=S.words.find(x=>x.id==id);
if(!w)return `<div class="c"><h2>Revisão concluída 🎉</h2><p>${RV.n?RV.n+' cartões revisados.':'Nada para revisar hoje.'} Os intervalos foram atualizados.</p><button onclick="go('home')">Voltar</button></div>`;RV.w=w;RV.q.unshift(id);RV.q.shift();
return `<div class="c"><span class="m">Faltam ${RV.q.length+1}</span><h2>${esc(w.en)} <button class="s" onclick="speak('${esc(w.en).replace(/'/g,'')}')">🔊</button></h2>${RV.sh?`<p class="big">${esc(w.pt)}</p><p class="m">${esc(w.ex)}</p><div class="g"><button class="s" onclick="grade(0)">Errei</button><button class="s" onclick="grade(3)">Difícil</button><button class="s" onclick="grade(4)">Fácil</button><button class="s" onclick="grade(5)">Muito fácil</button></div>`:`<button onclick="RV.sh=1;render()">Mostrar resposta</button>`}</div>`}
const CATS=['Vocabulário cotidiano','Trabalho','Viagens','Conversação','Verbos','Phrasal verbs','Expressões idiomáticas','Gramática','Inglês profissional','Erros recorrentes'];
function addForm(){const en=$('#we').value.trim(),pt=$('#wp').value.trim();if(!en||!pt)return alert('Preencha inglês e português.');addCard(en,pt,$('#wx').value.trim(),$('#wc').value)||alert('Já existe.');render()}
function editW(id){const w=S.words.find(x=>x.id==id),a=prompt('Inglês:',w.en);if(a===null)return;const b=prompt('Português:',w.pt);if(b===null)return;w.en=a.trim()||w.en;w.pt=b.trim()||w.pt;save();render()}
function delW(id){if(confirm('Excluir esta palavra?')){S.words=S.words.filter(w=>w.id!=id);save();render()}}
function csv(){const rows=[['en','pt','exemplo','categoria','adicionada']].concat(S.words.map(w=>[w.en,w.pt,w.ex,w.cat,w.added]));dl('glossario.csv',rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'))}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.words)||!Array.isArray(d.log)||typeof d.done!='object')throw 0;if(!confirm('Substituir seus dados atuais pelo backup?'))return;S=Object.assign({},def,d);save();apply();go('home')}catch(e){alert('Arquivo inválido. Nada foi alterado.')}};r.readAsText(f)}
function apply(){const r=document.documentElement;r.dataset.theme=S.theme=='auto'?'':S.theme;r.dataset.acc=S.acc}
function vHome(){const m=Math.round(mins(day())),d=dues().length,nl=nextLes(),done=Object.keys(S.done).length,xp=S.log.reduce((a,l)=>a+l.xp,0),tot=Math.round(S.log.reduce((a,l)=>a+l.min,0));
const st=(ok,t,s,f)=>`<div class="c" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>${ok?'✓ ':''}${t}</b><div class="m">${s}</div></div><button class="${ok?'s':''}" onclick="${f}">${ok?'Refazer':'Ir'}</button></div>`;
return `<h1>Olá! 👋</h1><div class="c"><span class="tag">Nível ${esc(S.lvl)} (estimado)</span><p class="m">Meta de hoje: ${m} / ${S.goal} min (tempo estimado)</p><div class="bar"><i style="width:${Math.min(100,m/S.goal*100)}%"></i></div><br><button onclick="${d?"go('rev')":nl?'openLes('+nl.id+')':"go('lessons')"}">Começar a estudar</button></div>
<h3>Tarefa do dia</h3>${st(!d&&S.log.some(l=>l.d==day()&&l.t=='rev'),'Revisão espaçada (~3 min)',d+' cartão(ões) para hoje',"go('rev')")}${nl?st(S.log.some(l=>l.d==day()&&l.t=='lesson'),'Aula: '+nl.t+' (~6 min)',nl.obj,'openLes('+nl.id+')'):'<div class="c">Todas as aulas disponíveis concluídas 🎉</div>'}${st(0,'Salvar 3 palavras novas (~2 min)','No glossário','go(\'words\')')}
<div class="g"><div class="c"><div class="big">${streak()}</div><span class="m">dias seguidos</span></div><div class="c"><div class="big">${xp}</div><span class="m">XP</span></div><div class="c"><div class="big">${tot}</div><span class="m">min acumulados</span></div><div class="c"><div class="big">${S.words.length}</div><span class="m">palavras</span></div><div class="c"><div class="big">${done}/${LES.length}</div><span class="m">aulas</span></div></div>`}
function vLes(){return `<h1>Aulas</h1><p class="m">Nível ${esc(S.lvl)}. Mais módulos entram em breve.</p>${LES.map(l=>`<div class="c"><b>${l.id}. ${l.t}</b> ${S.done[l.id]?`<span class="tag">${S.done[l.id].pct}%</span>`:''}<p class="m">${l.obj}</p><button onclick="openLes(${l.id})">${S.done[l.id]?'Revisar':'Abrir'}</button></div>`).join('')}`}
function vLesson(){const l=RV.l;return `<button class="s" onclick="go('lessons')">← Voltar</button><div class="c"><h2>${l.t}</h2><p><b>Objetivo:</b> ${l.obj}</p><p>${l.exp}</p>${l.ex.map(e=>`<p><b>${e[0]}</b> <button class="s" onclick="speak('${e[0].replace(/'/g,"\\'")}')">🔊</button><br><span class="m">${e[1]}</span></p>`).join('')}<p class="m">Áudio com voz sintetizada do navegador.</p><h3>Vocabulário</h3>${l.ws.map((w,i)=>`<p>${w[0]} — ${w[1]} <button class="s" onclick="addW(${l.id},${i})">+ glossário</button></p>`).join('')}<button onclick="startQ(${l.id})">Fazer exercícios</button></div>`}
function vWords(){const q=(RV&&RV.fq||'').toLowerCase(),list=S.words.filter(w=>(w.en+w.pt).toLowerCase().includes(q));return `<h1>Glossário</h1><div class="c"><input id="we" placeholder="Inglês"><input id="wp" placeholder="Português"><input id="wx" placeholder="Exemplo (opcional)"><select id="wc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button onclick="addForm()">Adicionar</button></div><input placeholder="Pesquisar…" oninput="RV={fq:this.value};render();const e=$('#sq');e.focus();e.setSelectionRange(99,99)" id="sq" value="${esc(q)}"><p class="m">${S.words.length} palavra(s) · <button class="s" onclick="csv()">Exportar CSV</button></p>${list.map(w=>`<div class="c"><b>${esc(w.en)}</b> — ${esc(w.pt)} <span class="tag">${esc(w.cat)}</span><div class="m">${esc(w.ex)} · próxima revisão: ${w.due}</div><button class="s" onclick="editW(${w.id})">Editar</button> <button class="s" onclick="delW(${w.id})">Excluir</button></div>`).join('')}`}
function vSet(){return `<h1>Configurações</h1><div class="c"><label>Meta diária (min)<input type="number" min="5" max="120" value="${S.goal}" onchange="S.goal=Math.max(5,+this.value||20);save();render()"></label><label>Tema<select onchange="S.theme=this.value;save();apply()"><option value="auto">Automático</option><option value="light" ${S.theme=='light'?'selected':''}>Claro</option><option value="dark" ${S.theme=='dark'?'selected':''}>Escuro</option></select></label><label>Cor de destaque<select onchange="S.acc=this.value;save();apply()"><option value="orange">Laranja</option><option value="pink" ${S.acc=='pink'?'selected':''}>Rosa pink</option></select></label></div>
<div class="c"><h3>Instalar como app</h3>${DP?'<button onclick="instalar()">Instalar My English</button>':''}<p class="m"><b>Android (Chrome):</b> menu ⋮ → Instalar app.<br><b>iPhone (Safari):</b> botão Compartilhar → Adicionar à Tela de Início.<br><b>Computador (Chrome/Edge):</b> ícone de instalar na barra de endereço.<br>Offline: a interface, as aulas, o glossário e as revisões abrem sem internet depois da primeira visita. Não há sincronização entre aparelhos.</p></div>
<div class="c"><h3>Backup</h3><p class="m">Seus dados ficam só neste navegador/aparelho — não há sincronização entre dispositivos. Exporte um backup de vez em quando.</p><button onclick="dl('my-english-journey-backup.json',JSON.stringify(S))">Exportar backup</button> <input type="file" accept=".json" onchange="imp(this.files[0])"></div>
<div class="c"><button class="s" onclick="S.ob=0;V='ob';render()">Refazer diagnóstico</button> <button class="s" onclick="if(confirm('Apagar TODO o progresso?')){S={...def};save();apply();V='ob';render()}">Apagar tudo</button></div>`}
function vOb(){return `<h1>My English Journey</h1><div class="c"><p>Vamos começar com um diagnóstico rápido (6 perguntas, ~3 min). Ele cobre vocabulário, gramática, leitura e construção de frases — <b>não</b> é uma certificação oficial. Listening e speaking ainda não estão no teste.</p><p class="m">Configuração inicial: 20 min por dia (você pode mudar em Configurações).</p><button onclick="run(DQ,endDiag,'diag')">Começar diagnóstico</button></div>`}
function vDiag(){const d=S.diag;return `<h1>Resultado</h1><div class="c"><span class="tag">Nível inicial estimado: ${S.lvl}</span><p>${d.sc} de ${d.n} acertos.</p><p><b>Atenção a:</b> ${d.tags.length?d.tags.join(', '):'nenhuma área crítica neste teste curto'}.</p><p><b>Primeira unidade:</b> ${LES[0].t}. Plano: 20 min/dia — revisão, aula nova e vocabulário.</p><button onclick="go('home')">Ir para o painel</button></div>`}
function vDone(){const{l,pct,miss}=RV;return `<div class="c"><h2>Aula concluída: ${pct}%</h2><p>${miss?miss+' erro(s) viraram cartões de revisão para você.':'Sem erros — ótimo!'}</p><button onclick="go('home')">Painel</button></div>`}
function render(){const m={ob:vOb,diag:vDiag,home:vHome,lessons:vLes,les:vLesson,lesdone:vDone,words:vWords,rev:vRev,set:vSet,run:vRun};$('#app').innerHTML=m[V]();
$('#nav').innerHTML=S.ob?[['home','Hoje'],['lessons','Aulas'],['words','Glossário'],['rev','Revisar'+(dues().length?' ('+dues().length+')':'')],['set','Ajustes']].map(([k,t])=>`<button class="${V==k?'on':''}" onclick="${k=='rev'?'RV=null;':''}go('${k}')">${t}</button>`).join(''):'';window.scrollTo(0,0)}
let DP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(V=='set')render()});
function instalar(){DP&&DP.prompt()}
if('serviceWorker' in navigator&&location.protocol!='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
apply();render();
</script></body></html>
